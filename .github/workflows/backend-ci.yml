name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdi
          POSTGRES_PASSWORD: cdi_test_only
          POSTGRES_DB: cdi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdi -d cdi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CDI_TEST_DATABASE_URL: postgresql://cdi:cdi_test_only@localhost:5432/cdi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install extraction engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Static checks
        run: |
          python -m ruff check app scripts tests
          python -m ruff format --check app scripts tests
          node --check app/static/app.js
      - name: SQLite and real Postgres acceptance tests
        run: python -m pytest -q
      - name: Build deployment image
        run: docker build -t cdi-backend:ci .
