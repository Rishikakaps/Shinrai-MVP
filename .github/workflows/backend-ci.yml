name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ["11025:1025", "18025:8025"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdi
          POSTGRES_PASSWORD: cdi_test_only
          POSTGRES_DB: cdi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdi -d cdi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CDI_TEST_DATABASE_URL: postgresql://cdi:cdi_test_only@localhost:5432/cdi_test
      CDI_TEST_SMTP_PORT: "11025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci --ignore-scripts
      - name: Install extraction engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Static checks
        run: |
          python -m ruff check app scripts tests
          python -m ruff format --check app scripts tests
          node --check app/static/app.js
          node --check app/static/v2-app.js
          node --check app/static/field-test.js
      - name: Frontend state and edge-case tests
        run: npm run test:ui
      - name: SQLite and real Postgres acceptance tests
        run: python -m pytest -q
      - name: Field browser with real backend and synthetic media
        run: |
          npm install --prefix .run/browser-tools --no-package-lock --ignore-scripts playwright@1.62.1
          .run/browser-tools/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/.run/browser-tools/node_modules" node scripts/verify_field_browser.cjs
      - name: Build deployment image
        run: docker build -t cdi-backend:ci .
