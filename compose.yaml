services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CDI_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evidence-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
volumes:
  evidence-data:
