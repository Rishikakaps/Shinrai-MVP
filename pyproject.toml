[project]
name = "capital-deployment-integrity"
version = "0.1.0"
description = "Japan Day: controlled evidence reconciliation demo backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1", "pypdf>=6,<7", "pillow>=11,<14", "pytesseract>=0.3.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<6", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
